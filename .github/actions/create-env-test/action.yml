# Reusable composite action for creating .env.test file
# Used by test jobs that need environment variables

name: 'Create Test Environment'
description: 'Create .env.test with placeholder values for CI'

runs:
  using: 'composite'
  steps:
    - name: Create .env.test
      shell: bash
      run: | # pragma: allowlist secret
        cp env.test.example .env.test 2>/dev/null || cat > .env.test << 'EOF'
        NODE_ENV=test
        CUSOWN_QUIET_INFRA_LOGS=true
        NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key
        SUPABASE_SERVICE_ROLE_KEY=placeholder-service-role-key
        NEXT_PUBLIC_APP_URL=https://example.com
        NEXT_PUBLIC_MARKETING_URL=https://example.com
        SALON_TOKEN_SECRET=test-secret-for-ci-min-32-characters-long # pragma: allowlist secret
        CRON_SECRET=test-cron-for-ci-min-16 # pragma: allowlist secret
        REDIS_ENABLED=false
        UPLOAD_STORAGE_BUCKET=uploads
        EOF
